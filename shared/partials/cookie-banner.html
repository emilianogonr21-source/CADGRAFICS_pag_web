  Partial: aviso de cookies
  Requiere assets/js/shared/site-common.js (initCookieBanner / acceptCookies / rejectCookies)
  y assets/css/shared/base.css
-->
<div class="cookie-banner" id="cookieBanner">
  <p>Gestionar las cookies o rechazarlas</p>
  <div class="cookie-buttons">
    <button type="button" class="btn-secondary" onclick="acceptCookies()">Aceptar</button>
    <button type="button" class="btn-secondary" onclick="rejectCookies()">Rechazar</button>
  </div>
</div>
