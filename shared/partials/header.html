<!--
  Partial: header / navegación Cadgrafics (fuente de verdad)

  Placeholders:
    {{ROOT}}               "" en la raíz, "../../" desde pages/marca/
    {{LOGO_HREF}}          "#" en inicio, "{{ROOT}}index.html" en el resto
    {{INDEX_MARCAS}}       "#marcas" o "{{ROOT}}index.html#marcas"
    {{INDEX_SERVICIOS}}    "#servicios" o "{{ROOT}}index.html#servicios"
    {{INDEX_CASOS}}        "#casos" o "{{ROOT}}index.html#casos"
    {{ACTIVE_ADOBE}}       aria-current="page" en páginas Adobe (vacío en otras)
    {{ACTIVE_AUTODESK}}    idem Autodesk
    {{ACTIVE_CHAOS}}       idem SketchUp (carpeta chaos)
    {{ACTIVE_HP}}          idem HP
    {{ACTIVE_DELL}}        idem Dell
    {{CONTACT_CLASSES}}    textbutton-trigger

  Sincronizar a las páginas:  python tools/sync-header.py
-->
<header class="header" id="header">
  <div class="container nav-container">
    <a href="{{LOGO_HREF}}" class="brand-link" aria-label="Ir a inicio de Cadgrafics">
      <img src="{{ROOT}}assets/images/brand/logo_cadgrafics.png" alt="" class="logo" loading="eager" width="288" height="72"/>
      <span class="brand-name">CADGRAFICS</span>
    </a>
    <nav aria-label="Navegación principal">
      <ul class="nav-menu" id="navMenu">
        <li class="nav-item">
          <a href="{{INDEX_MARCAS}}" aria-haspopup="true" aria-expanded="false">
            Marcas <svg width="12" height="12" aria-hidden="true"><use href="#icon-chevron-down"/></svg>
          </a>
          <ul class="dropdown-menu">
            <li class="dropdown-submenu">
              <a href="{{ROOT}}pages/adobe/home-adobe.html" aria-haspopup="true" aria-expanded="false"{{ACTIVE_ADOBE}}>
                Adobe <svg width="10" height="10" aria-hidden="true"><use href="#icon-chevron-right"/></svg>
              </a>
              <ul class="dropdown-submenu-menu">
                <li><a href="{{ROOT}}pages/adobe/acrobat-studio.html">Acrobat Studio</a></li>
                <li><a href="{{ROOT}}pages/adobe/creative-cloud.html">Creative Cloud</a></li>
              </ul>
            </li>
            <li class="dropdown-submenu">
              <a href="{{ROOT}}pages/autodesk/home-autodesk.html" aria-haspopup="true" aria-expanded="false"{{ACTIVE_AUTODESK}}>
                Autodesk <svg width="10" height="10" aria-hidden="true"><use href="#icon-chevron-right"/></svg>
              </a>
              <ul class="dropdown-submenu-menu">
                <li><a href="{{ROOT}}pages/autodesk/aec-collection.html">AEC Collection</a></li>
              </ul>
            </li>
            <li>
              <a href="{{ROOT}}pages/chaos/home-chaos.html"{{ACTIVE_CHAOS}}>
                Sketchup
              </a>
            </li>
            <li>
              <a href="{{ROOT}}pages/hp/home-hp.html"{{ACTIVE_HP}}>
                HP
              </a>
            </li>
            <li>
              <a href="{{ROOT}}pages/dell/home-dell.html"{{ACTIVE_DELL}}>
                Dell
              </a>
            </li>
          </ul>
        </li>
        <li><a href="{{INDEX_SERVICIOS}}">Soluciones Claves</a></li>
        <li><a href="{{INDEX_CASOS}}">Casos</a></li>
        <li><a href="#contacto" class="{{CONTACT_CLASSES}}" aria-label="Contactar a Cadgrafics">Contáctanos</a></li>
      </ul>
    </nav>
    <button class="mobile-toggle" id="mobileToggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="navMenu">
      <span class="hamburger" aria-hidden="true">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </span>
    </button>
  </div>
</header>
